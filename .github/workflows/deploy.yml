name: Build and Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["dev"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build the project
        run: pnpm run build
      
      - name: Clean up problematic files
        run: |
          # Remove any symlinks or problematic files
          find dist/ -type l -delete
          # Remove pagefind index files that might cause issues
          rm -rf dist/pagefind
          # Remove any temporary files
          find dist/ -name "*.tmp" -delete
          find dist/ -name "*.temp" -delete
          # Remove any hidden files that might cause issues
          find dist/ -name ".*" -type f -delete
          # Remove any files with special characters in names
          find dist/ -name "*[^a-zA-Z0-9._-]*" -type f -delete || true
      
      - name: Check artifact size and content
        run: |
          echo "=== Checking artifact size ==="
          du -sh dist/
          echo ""
          echo "=== Checking for symlinks ==="
          find dist/ -type l -ls || echo "No symlinks found"
          echo ""
          echo "=== Checking for large files (>10MB) ==="
          find dist/ -type f -size +10M -exec ls -lh {} \; || echo "No files larger than 10MB found"
          echo ""
          echo "=== Total file count ==="
          find dist/ -type f | wc -l
          echo ""
          echo "=== Directory structure (first level) ==="
          ls -la dist/
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: dist/
          retention-days: 30

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 