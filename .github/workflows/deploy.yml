name: Build and Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["dev"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  security-events: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build the project
        run: pnpm run build
      
      - name: Clean up problematic files
        run: |
          echo "Starting cleanup process..."
          
          # Remove any symlinks or problematic files
          echo "Removing symlinks..."
          find dist/ -type l -delete 2>/dev/null || echo "No symlinks found or already removed"
          
          # Remove pagefind index files that might cause issues
          echo "Removing pagefind files..."
          rm -rf dist/pagefind 2>/dev/null || echo "No pagefind directory found"
          
          # Remove any temporary files
          echo "Removing temporary files..."
          find dist/ -name "*.tmp" -delete 2>/dev/null || echo "No .tmp files found"
          find dist/ -name "*.temp" -delete 2>/dev/null || echo "No .temp files found"
          
          # Remove any hidden files that might cause issues (but be more careful)
          echo "Removing hidden files..."
          find dist/ -name ".*" -type f -not -name ".gitkeep" -delete 2>/dev/null || echo "No hidden files found"
          
          # Remove any files with special characters in names (more conservative approach)
          echo "Checking for files with special characters..."
          find dist/ -name "*[^a-zA-Z0-9._/-]*" -type f -ls 2>/dev/null || echo "No files with special characters found"
          
          # Ensure proper file permissions
          echo "Setting file permissions..."
          find dist/ -type f -exec chmod 644 {} \; 2>/dev/null || echo "Permission setting completed"
          find dist/ -type d -exec chmod 755 {} \; 2>/dev/null || echo "Directory permission setting completed"
          
          echo "Cleanup completed successfully"
      
      - name: Check artifact size and content
        run: |
          echo "=== Checking artifact size ==="
          du -sh dist/
          echo ""
          echo "=== Checking for symlinks ==="
          find dist/ -type l -ls || echo "No symlinks found"
          echo ""
          echo "=== Checking for large files (>10MB) ==="
          find dist/ -type f -size +10M -exec ls -lh {} \; || echo "No files larger than 10MB found"
          echo ""
          echo "=== Total file count ==="
          find dist/ -type f | wc -l
          echo ""
          echo "=== Directory structure (first level) ==="
          ls -la dist/
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: dist/
      
      - name: Verify artifacts
        run: |
          echo "=== Verifying downloaded artifacts ==="
          ls -la dist/
          echo "=== Checking for any remaining symlinks ==="
          find dist/ -type l -ls || echo "No symlinks found"
          echo "=== Final size check ==="
          du -sh dist/
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 